<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img">
  <title>余音 · 民乐老师的 AI 助教</title>
  <style>
    /* 主时间线 8s 循环：朱砂晕染 → 音点亮起 → 涟漪三环渐散 → 余音浮现 → 归于平静 */
    .scene{animation:scene 8s ease-in-out infinite}
    .halo{transform-box:fill-box;transform-origin:center;animation:halo 8s ease-in-out infinite}
    .wet{transform-box:fill-box;transform-origin:center;animation:wet 8s ease-in-out infinite}
    .dotg{transform-box:fill-box;transform-origin:center;animation:popDot 8s ease-out infinite}
    .r1,.r2,.r3{transform-box:fill-box;transform-origin:center}
    .r1{animation:ripple1 8s ease-out infinite}
    .r2{animation:ripple2 8s ease-out infinite}
    .r3{animation:ripple3 8s ease-out infinite}
    .word{animation:riseWord 8s ease-out infinite}
    .tagline{animation:fadeTag 8s ease-out infinite}

    @keyframes scene{0%{opacity:0}4%{opacity:1}86%{opacity:1}97%{opacity:0}100%{opacity:0}}
    /* 淡晕：如朱砂在宣纸上慢慢洇开 */
    @keyframes halo{
      0%,5%{opacity:0;transform:scale(.6)}
      20%{opacity:1;transform:scale(1)}
      60%{opacity:.85;transform:scale(1.04)}
      100%{opacity:.85;transform:scale(1.04)}
    }
    /* 湿墨环：带宣纸洇痕的中层 */
    @keyframes wet{
      0%,8%{opacity:0;transform:scale(.5)}
      24%{opacity:.4;transform:scale(1)}
      60%{opacity:.3;transform:scale(1.06)}
      100%{opacity:.3;transform:scale(1.06)}
    }
    @keyframes popDot{
      0%,12%{transform:scale(0)}
      21%{transform:scale(1.15)}
      27%,100%{transform:scale(1)}
    }
    @keyframes ripple1{
      0%,26%{opacity:0;transform:scale(.4)}
      35%{opacity:.5}
      54%{opacity:0;transform:scale(2)}
      100%{opacity:0;transform:scale(2)}
    }
    @keyframes ripple2{
      0%,36%{opacity:0;transform:scale(.4)}
      45%{opacity:.32}
      64%{opacity:0;transform:scale(2)}
      100%{opacity:0;transform:scale(2)}
    }
    @keyframes ripple3{
      0%,46%{opacity:0;transform:scale(.4)}
      55%{opacity:.2}
      74%{opacity:0;transform:scale(2)}
      100%{opacity:0;transform:scale(2)}
    }
    @keyframes riseWord{
      0%,48%{opacity:0;transform:translateY(10px)}
      62%,100%{opacity:1;transform:translateY(0)}
    }
    @keyframes fadeTag{0%,58%{opacity:0}72%,100%{opacity:1}}
  </style>
  <defs>
    <radialGradient id="yg" cx="40%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#C4573F"/>
      <stop offset="55%" stop-color="#A63A2C"/>
      <stop offset="100%" stop-color="#8E3025"/>
    </radialGradient>
    <!-- 淡晕：朱砂色向外融于纸 -->
    <radialGradient id="haloG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4573F" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#C4573F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C4573F" stop-opacity="0"/>
    </radialGradient>
    <!-- 湿墨洇痕：湍流只作用于这一层，红调不发灰 -->
    <filter id="bleed" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="6"/>
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- 宣纸卡片底 -->
  <rect width="560" height="360" rx="18" fill="#FAF8F4"/>
  <rect x="0.5" y="0.5" width="559" height="359" rx="17.5" fill="none" stroke="#EAE4D9"/>

  <g class="scene">
    <!-- 水墨淡晕（静态兜底：完整可见） -->
    <circle class="halo" cx="280" cy="150" r="86" fill="url(#haloG)"/>
    <!-- 湿墨洇痕中层 -->
    <circle class="wet" cx="280" cy="150" r="44" fill="#B04A3A" opacity="0.28" filter="url(#bleed)"/>

    <!-- 涟漪三环 -->
    <circle class="r1" cx="280" cy="150" r="56" fill="none" stroke="#B04A3A" stroke-width="2" opacity="0.35"/>
    <circle class="r2" cx="280" cy="150" r="56" fill="none" stroke="#B04A3A" stroke-width="1.4" opacity="0.18"/>
    <circle class="r3" cx="280" cy="150" r="56" fill="none" stroke="#B04A3A" stroke-width="1" opacity="0.1"/>

    <!-- 朱砂音点 -->
    <g class="dotg">
      <circle cx="280" cy="150" r="30" fill="url(#yg)"/>
      <circle cx="271" cy="141" r="5.5" fill="#D98A75" opacity="0.32"/>
    </g>

    <!-- 字标 -->
    <text class="word" x="280" y="262" text-anchor="middle" font-family="Songti SC,STSong,STZhongsong,SimSun,serif" font-size="50" font-weight="500" fill="#1C1A17" letter-spacing="20">余音</text>
    <text class="tagline" x="280" y="306" text-anchor="middle" font-family="PingFang SC,-apple-system,sans-serif" font-size="15" fill="#8A8378" letter-spacing="3">课结束了，声音还在</text>
  </g>
</svg>
