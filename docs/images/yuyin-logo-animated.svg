<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img">
  <title>余音 · 民乐老师的 AI 助教</title>
  <style>
    /* 主时间线 8s 循环：晕染 → 琴竹落下 → 淡朱砂点亮 → 涟漪渐散 → 余音浮现 → 归于平静 */
    .scene{animation:scene 8s ease-in-out infinite}
    .halo{transform-box:fill-box;transform-origin:center;animation:halo 8s ease-in-out infinite}
    .bamboo{animation:dropBamboo 8s cubic-bezier(.3,.7,.3,1) infinite}
    .dotg{transform-box:fill-box;transform-origin:center;animation:popDot 8s ease-out infinite}
    .r1,.r2,.r3{transform-box:fill-box;transform-origin:center}
    .r1{animation:ripple1 8s ease-out infinite}
    .r2{animation:ripple2 8s ease-out infinite}
    .r3{animation:ripple3 8s ease-out infinite}
    .word{animation:riseWord 8s ease-out infinite}
    .tagline{animation:fadeTag 8s ease-out infinite}

    @keyframes scene{0%{opacity:0}4%{opacity:1}86%{opacity:1}97%{opacity:0}100%{opacity:0}}
    @keyframes halo{
      0%,5%{opacity:0;transform:scale(.6)}
      18%{opacity:1;transform:scale(1)}
      70%,100%{opacity:.85;transform:scale(1.05)}
    }
    /* 琴竹落下（击弦的动作还在，只是不画弦） */
    @keyframes dropBamboo{
      0%,12%{opacity:0;transform:translate(80px,-66px) scale(1.3)}
      23%{opacity:1;transform:translate(80px,-2px) scale(1.3)}
      30%{opacity:1;transform:translate(80px,-2px) scale(1.3)}
      62%,100%{opacity:0;transform:translate(80px,-10px) scale(1.3)}
    }
    /* 点亮：竹落之时，淡朱砂浮现 */
    @keyframes popDot{
      0%,23%{transform:scale(0);opacity:0}
      32%{transform:scale(1.14);opacity:.9}
      38%,100%{transform:scale(1);opacity:.82}
    }
    @keyframes ripple1{
      0%,28%{opacity:0;transform:scale(.4)}
      37%{opacity:.45}
      56%{opacity:0;transform:scale(2)}
      100%{opacity:0;transform:scale(2)}
    }
    @keyframes ripple2{
      0%,38%{opacity:0;transform:scale(.4)}
      47%{opacity:.28}
      66%{opacity:0;transform:scale(2)}
      100%{opacity:0;transform:scale(2)}
    }
    @keyframes ripple3{
      0%,48%{opacity:0;transform:scale(.4)}
      57%{opacity:.16}
      76%{opacity:0;transform:scale(2)}
      100%{opacity:0;transform:scale(2)}
    }
    @keyframes riseWord{
      0%,48%{opacity:0;transform:translateY(10px)}
      64%,100%{opacity:1;transform:translateY(0)}
    }
    @keyframes fadeTag{0%,58%{opacity:0}72%,100%{opacity:1}}
  </style>
  <defs>
    <!-- 淡朱砂：整体降一档饱和与明度差，柔而不脏 -->
    <radialGradient id="yg" cx="40%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#C9664E"/>
      <stop offset="55%" stop-color="#B04A3A"/>
      <stop offset="100%" stop-color="#A04234"/>
    </radialGradient>
    <!-- 淡晕：朱砂色向外融于纸 -->
    <radialGradient id="haloG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4573F" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#C4573F" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#C4573F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 宣纸卡片底 -->
  <rect width="560" height="360" rx="18" fill="#FAF8F4"/>
  <rect x="0.5" y="0.5" width="559" height="359" rx="17.5" fill="none" stroke="#EAE4D9"/>

  <g class="scene">
    <!-- 水墨淡晕（静态兜底：完整可见） -->
    <circle class="halo" cx="280" cy="150" r="84" fill="url(#haloG)"/>

    <!-- 涟漪三环 -->
    <circle class="r1" cx="280" cy="150" r="52" fill="none" stroke="#B04A3A" stroke-width="2" opacity="0.32"/>
    <circle class="r2" cx="280" cy="150" r="52" fill="none" stroke="#B04A3A" stroke-width="1.4" opacity="0.16"/>
    <circle class="r3" cx="280" cy="150" r="52" fill="none" stroke="#B04A3A" stroke-width="1" opacity="0.09"/>

    <!-- 淡朱砂音点 -->
    <g class="dotg" opacity="0.82">
      <circle cx="280" cy="150" r="27" fill="url(#yg)"/>
      <circle cx="271.5" cy="141.5" r="6" fill="#D98A75" opacity="0.4"/>
    </g>

    <!-- 琴竹：填充纺锤形，静态兜底=落定位置 -->
    <g class="bamboo" transform="translate(80,-2) scale(1.3)">
      <path d="M216 26 C 200 42, 186 60, 175 80 C 171 88, 168 96, 165.5 102 C 165 104, 166 105.5, 167.5 105 C 171.5 102, 176 95, 181 87 C 192 69, 205 47, 218 30 C 219 28, 218 24, 216 26 Z" fill="#1C1A17" opacity="0.9"/>
      <ellipse cx="160" cy="108" rx="4" ry="5.6" fill="#1C1A17" transform="rotate(-25 160 108)"/>
    </g>

<!-- 字标 -->
    <text class="word" x="280" y="262" text-anchor="middle" font-family="Songti SC,STSong,STZhongsong,SimSun,serif" font-size="50" font-weight="500" fill="#1C1A17" letter-spacing="20">余音</text>
    <text class="tagline" x="280" y="306" text-anchor="middle" font-family="PingFang SC,-apple-system,sans-serif" font-size="15" fill="#8A8378" letter-spacing="3">课结束了，声音还在</text>
  </g>
</svg>
