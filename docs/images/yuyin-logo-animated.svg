<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img">
  <title>余音 · 民乐老师的 AI 助教</title>
  <style>
    /* 主时间线 8s 循环：弦划入 → 琴竹落下 → 音点亮 → 涟漪散 → 余音浮现 → 归于平静 */
    .scene{animation:scene 8s ease-in-out infinite}
    .string{stroke-dasharray:460;animation:drawString 8s ease-out infinite}
    .bamboo{animation:dropBamboo 8s cubic-bezier(.3,.7,.3,1) infinite}
    .dotg{transform-box:fill-box;transform-origin:center;animation:popDot 8s ease-out infinite}
    .r1,.r2{transform-box:fill-box;transform-origin:center}
    .r1{animation:ripple1 8s ease-out infinite}
    .r2{animation:ripple2 8s ease-out infinite}
    .word{animation:riseWord 8s ease-out infinite}
    .tagline{animation:fadeTag 8s ease-out infinite}

    @keyframes scene{0%{opacity:0}4%{opacity:1}86%{opacity:1}97%{opacity:0}100%{opacity:0}}
    @keyframes drawString{0%,6%{stroke-dashoffset:460}20%,100%{stroke-dashoffset:0}}
    @keyframes dropBamboo{
      0%,12%{opacity:0;transform:translate(80px,-64px) scale(1.3)}
      23%{opacity:1;transform:translate(80px,-2px) scale(1.3)}
      100%{opacity:1;transform:translate(80px,-2px) scale(1.3)}
    }
    @keyframes popDot{
      0%,23%{transform:scale(0)}
      31%{transform:scale(1.18)}
      37%,100%{transform:scale(1)}
    }
    @keyframes ripple1{
      0%,30%{opacity:0;transform:scale(.4)}
      38%{opacity:.5}
      56%{opacity:0;transform:scale(1.9)}
      100%{opacity:0;transform:scale(1.9)}
    }
    @keyframes ripple2{
      0%,38%{opacity:0;transform:scale(.4)}
      47%{opacity:.32}
      64%{opacity:0;transform:scale(1.9)}
      100%{opacity:0;transform:scale(1.9)}
    }
    @keyframes riseWord{
      0%,44%{opacity:0;transform:translateY(10px)}
      58%,100%{opacity:1;transform:translateY(0)}
    }
    @keyframes fadeTag{0%,54%{opacity:0}68%,100%{opacity:1}}
  </style>
  <defs>
    <radialGradient id="yg" cx="40%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#C4573F"/>
      <stop offset="55%" stop-color="#A63A2C"/>
      <stop offset="100%" stop-color="#8E3025"/>
    </radialGradient>
  </defs>

  <!-- 宣纸卡片底 -->
  <rect width="560" height="360" rx="18" fill="#FAF8F4"/>
  <rect x="0.5" y="0.5" width="559" height="359" rx="17.5" fill="none" stroke="#EAE4D9"/>

  <g class="scene">
    <!-- 琴弦（静态兜底：完整可见） -->
    <path class="string" d="M60 156 Q 280 144 500 156" stroke="#1C1A17" stroke-width="2.4" fill="none" opacity="0.8" stroke-dasharray="460" stroke-dashoffset="0"/>

    <!-- 涟漪环 -->
    <circle class="r1" cx="280" cy="150" r="50" fill="none" stroke="#B04A3A" stroke-width="2" opacity="0.35"/>
    <circle class="r2" cx="280" cy="150" r="66" fill="none" stroke="#B04A3A" stroke-width="1.4" opacity="0.18"/>

    <!-- 朱砂音点 -->
    <g class="dotg">
      <circle cx="280" cy="150" r="30" fill="url(#yg)"/>
      <circle cx="270" cy="140" r="7.5" fill="#D98A75" opacity="0.55"/>
    </g>

    <!-- 琴竹（填充纺锤形，静态兜底=落定位置） -->
    <g class="bamboo" transform="translate(80,-2) scale(1.3)">
      <path d="M216 26 C 200 42, 186 60, 175 80 C 171 88, 168 96, 165.5 102 C 165 104, 166 105.5, 167.5 105 C 171.5 102, 176 95, 181 87 C 192 69, 205 47, 218 30 C 219 28, 218 24, 216 26 Z" fill="#1C1A17"/>
      <ellipse cx="160" cy="108" rx="4" ry="5.6" fill="#1C1A17" transform="rotate(-25 160 108)"/>
    </g>

    <!-- 字标 -->
    <text class="word" x="280" y="256" text-anchor="middle" font-family="Songti SC,STSong,STZhongsong,SimSun,serif" font-size="48" font-weight="500" fill="#1C1A17" letter-spacing="20">余音</text>
    <text class="tagline" x="280" y="300" text-anchor="middle" font-family="PingFang SC,-apple-system,sans-serif" font-size="15" fill="#8A8378" letter-spacing="3">课结束了，声音还在</text>
  </g>
</svg>
