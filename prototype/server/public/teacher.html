<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>余音 · 老师端</title>
<style>
:root{
  /* 余音 · 设计 token（规范 v1）：宣纸底 / 墨阶 / 黛青·竹青 / 朱砂唯一强调 */
  --bg:#FAF8F4; --bg2:#F3EFE7; --card:#FFFFFF; --line:#EAE4D9; --line2:#F0EBE1;
  --text:#1C1A17; --muted:#6B655C; --muted2:#A19A8F;
  --brand:#B04A3A; --brand-soft:rgba(176,74,58,.08); --brand-line:#DDBBB1;
  --stu:#5C8B7B; --stu-soft:rgba(92,139,123,.10); --stu-line:#BCD4CB;
  --ok:#5C8B7B; --ok-soft:rgba(92,139,123,.12); --warn:#A6752C; --warn-soft:#F7EFE0;
  --bad:#B04A3A; --bad-soft:rgba(176,74,58,.08); --info:#2F5D62; --info-soft:rgba(47,93,98,.08);
  --pur:#B04A3A; --pur-soft:rgba(176,74,58,.08);
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(28,26,23,.04),0 2px 6px rgba(28,26,23,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:820px;margin:0 auto;padding:0 12px 96px}
.hide{display:none !important}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(250,248,244,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:820px;margin:0 auto;padding:9px 12px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.logo .wm{font-family:"Songti SC","STSong",SimSun,serif;font-size:17px;letter-spacing:4px;font-weight:600}
.logo .role-tag{font-size:12px;color:var(--muted2);letter-spacing:1px;font-weight:500;margin-top:2px}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--brand)}
.role-sw{display:flex;background:var(--bg2);border-radius:11px;padding:3px}
.role-sw button{padding:6px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.role-sw button.on{background:#fff;color:var(--brand);box-shadow:var(--sh)}
.role-sw button.on.stu{color:var(--stu)}
.iconbtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:17px;border:1px solid var(--line);background:#fff}

/* ---------- 子导航 ---------- */
.subnav{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:55}
.subnav-in{max-width:820px;margin:0 auto;display:flex;overflow-x:auto;padding:0 6px}
.subnav-in::-webkit-scrollbar{display:none}
.subnav button{padding:11px 14px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.subnav button.on{color:var(--brand);border-bottom-color:var(--brand)}
.subnav.stu button.on{color:var(--stu);border-bottom-color:var(--stu)}

/* ---------- 卡片 & 通用 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:var(--sh)}
.card.tight{padding:12px}
h1{font-size:19px;margin:0}
h2{font-size:16px;margin:0 0 4px}
h3{font-size:14.5px;margin:0 0 8px}
.sec-title{display:flex;align-items:center;gap:8px;margin:18px 2px 2px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grow{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--text)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri.stu{background:var(--stu);border-color:var(--stu)}
.btn.ghost{background:#f7f8fa}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.xs{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:#f5c6c6;background:var(--bad-soft)}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:#f3f4f6;font-size:13px;color:#374151;border:1px solid transparent}
.chip.sel{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line);font-weight:600}
.chip.stu.sel{background:var(--stu-soft);color:var(--stu);border-color:var(--stu-line)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:#f3f4f6;color:#4b5563}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.pur{background:var(--pur-soft);color:var(--pur)}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
textarea{resize:vertical;min-height:62px;line-height:1.55}
input:focus,textarea:focus,select:focus{border-color:var(--brand-line)}
label.fld{display:block;margin-bottom:10px}
label.fld > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.empty{text-align:center;padding:34px 16px;color:var(--muted2);font-size:13.5px}
.divider{height:1px;background:var(--line2);margin:12px 0}

/* ---------- 谱面 ---------- */
.score-box{background:#fffdf9;border:1px solid #f0e6d8;border-radius:12px;padding:12px 10px;overflow-x:auto}
.media-box{margin-top:8px}
.media-box video,.media-box audio{width:100%;border-radius:10px;display:block}
.staff-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.staff-svg{display:block;max-width:none}
.note-g.clickable{cursor:pointer}
.note-g.clickable:hover ellipse{stroke:var(--brand);stroke-width:2.4}
.line-lbl{font-size:11.5px;color:var(--muted);margin:8px 0 3px;font-weight:700}
.line-lbl:first-child{margin-top:0}
.nline{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;padding:2px 0;border-bottom:1px dashed #eee}
.nline:last-child{border-bottom:none}
.note{position:relative;min-width:26px;padding:3px 2px 4px;text-align:center;border-radius:7px;font-family:"Songti SC","STSong",serif;font-size:16px;line-height:1.25;cursor:default;transition:.12s}
.note .num{display:block}
.note .oct{position:absolute;font-size:9px;line-height:1}
.note .oct.up{top:-1px;left:50%;transform:translateX(-50%)}
.note .oct.dn{bottom:8px;left:50%;transform:translateX(-50%)}
.note .dur{display:block;height:3px;border-bottom:1.5px solid #9aa0a6;margin:2px auto 0;width:70%}
.note .tech{display:block;font-size:9.5px;color:var(--pur);font-family:sans-serif;font-weight:700;line-height:1;height:11px}
.note.clickable{cursor:pointer}
.note.clickable:hover{background:var(--bg2)}
.note.sel{outline:2px solid var(--brand);outline-offset:-2px}
.note.dim{opacity:.35}
/* 批注：单色朱砂（不隐含严重度排序），类型由文字标签承载 */
.note[class*="m-"]{background:rgba(176,74,58,.07);box-shadow:inset 0 0 0 1.5px rgba(176,74,58,.45)}
.note .mbadge{position:absolute;top:-6px;right:-4px;min-width:14px;height:14px;border-radius:50%;background:var(--brand);color:#fff;font-size:9px;line-height:14px;font-family:sans-serif;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.legend span{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;background:rgba(176,74,58,.08);color:var(--brand)}
.tag.mk{background:transparent;border:1px solid var(--brand);color:var(--brand)}
.gdots{display:inline-flex;gap:5px;align-items:center}
.gdot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--brand);display:inline-block}
.gdot.on{background:var(--brand)}

/* ---------- 作业卡 ---------- */
.hw{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-top:10px;box-shadow:var(--sh)}
.hw .title{font-weight:700;font-size:15px}
.hw .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.badge-new{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}
.pbar{height:6px;border-radius:99px;background:#eef0f3;overflow:hidden;margin-top:8px}
.pbar > i{display:block;height:100%;background:var(--stu);border-radius:99px;transition:.3s}

/* ---------- 学生选择器 ---------- */
.stu-pick{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px}
.stu-pick::-webkit-scrollbar{display:none}
.stu-av{flex:0 0 auto;width:58px;text-align:center}
.stu-av .av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;margin:0 auto 4px;border:2.5px solid transparent}
.stu-av.on .av{border-color:var(--stu)}
.stu-av .nm{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu-av.on .nm{color:var(--stu);font-weight:700}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
.sheet h3{margin:0 0 10px}
.sheet-actions{display:flex;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(28,26,23,.94);color:#F5F1E8;padding:10px 18px;border-radius:13px;font-size:13.5px;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:80vw;text-align:center}
.toast.show{opacity:1;bottom:96px}

/* ---------- 引导 ---------- */
.intro{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px}
.intro-box{background:#fff;border-radius:16px;padding:20px;max-width:460px;max-height:86vh;overflow:auto}
.intro-box ol{padding-left:20px;margin:10px 0}
.intro-box li{margin:6px 0;font-size:13.5px}

.sdot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:4px;vertical-align:middle}
#syncDot{white-space:nowrap}
.foot{max-width:820px;margin:22px auto 0;padding:0 12px;color:var(--muted2);font-size:11.5px;line-height:1.7;text-align:center}
kbd{background:#f3f4f6;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px}

/* ---- PRD 扩展包 v0.2 ---- */
.mtrx{width:100%;border-collapse:collapse;font-size:13px}
.mtrx th{text-align:left;padding:8px 10px;background:var(--bg2);color:var(--muted);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--line)}
.mtrx td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.mtrx tr:last-child td{border-bottom:0}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;position:static;padding:0 12mm;color:#000;background:#fff}
  #printArea .wm{position:fixed;top:40%;left:20%;font-size:120px;color:rgba(0,0,0,.06);font-weight:800;transform:rotate(-25deg);pointer-events:none}
  #printArea .staff-svg{max-width:100%}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>

<header class="topbar"><div class="topbar-in">
  <div class="logo"><svg width="23" height="23" viewBox="0 0 56 56" aria-hidden="true" style="flex:none"><circle cx="28" cy="28" r="21" fill="none" stroke="#B04A3A" stroke-width="2.4" opacity=".35"/><circle cx="28" cy="28" r="11.5" fill="#B04A3A"/><circle cx="24" cy="24" r="3" fill="#D98A75" opacity=".5"/></svg><span class="wm">余音</span><span class="role-tag" id="roleTag"></span></div>
  <div class="role-sw" style="display:none">
    <button id="btnTeacher" class="on">老师端</button>
    <button id="btnStudent">孩子端</button>
  </div>
  <span id="syncDot" class="tiny muted" style="margin-left:auto"></span>
  <button class="iconbtn" id="btnMenu" title="数据与设置" style="font-size:15px">☰</button>
</div></header>

<nav class="subnav" id="navT"><div class="subnav-in">
  <button data-tab="t-class" class="on">上课记录</button>
  <button data-tab="t-review">回课驾驶舱</button>
  <button data-tab="t-stu">学生档案</button>
  <button data-tab="t-lib">谱库</button>
</div></nav>

<nav class="subnav stu hide" id="navS"><div class="subnav-in">
  <button data-tab="s-task" class="on">今日任务</button>
  <button data-tab="s-fb">我的回课</button>
  <button data-tab="s-lib">谱库</button>
</div></nav>

<main class="wrap" id="app"></main>
<div class="foot" id="foot"></div>

<div class="toast" id="toast"></div>
<div id="layer"></div>

<script>
/* =========================================================
   扬琴 AI 助教 · MVP 原型 v0.1
   单文件 / 无依赖 / 数据存 localStorage
   ========================================================= */
const VER='0.1', LSKEY='yangqin_mvp_v1', AUDIOKEY='yangqin_mvp_audio';
/* ===== 在线同步层：http(s) 打开=多端实时同步；file:// 打开=单机离线模式 ===== */
const ONLINE = location.protocol.indexOf('http')===0;
let LASTSYNC=0, SYNCING=false, PENDING=false;
async function api(path, body){
  const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});
  return r.json();
}
async function pull(silent){
  if(!ONLINE)return;
  if(SYNCING){PENDING=true;return}
  SYNCING=true;
  try{
    const r=await fetch('/api/state',{cache:'no-store'}); const j=await r.json();
    if(T.wiz){S.students=j.students;S.homework=j.homework;S.lessons=j.lessons;S.scores=j.scores}
    else S=j;
    if(!S.scores||!S.scores.length)S.scores=JSON.parse(JSON.stringify(SCORE_LIB));
    LASTSYNC=Date.now();syncBadge();
    if(!document.querySelector('#layer .mask'))render();
  }catch(e){syncBadge(true)}finally{SYNCING=false; if(PENDING){PENDING=false;pull(silent)}}
}
function syncBadge(err){
  const el=document.getElementById('syncDot'); if(!el)return;
  if(!ONLINE){el.innerHTML='<i class="sdot" style="background:#C9C2B4" title="单机模式：数据只存在这台设备"></i>';return}
  el.innerHTML=err?'<i class="sdot" style="background:#B04A3A" title="连不上服务器，稍后会自动重试"></i>'
    :'<i class="sdot" style="background:#C9C2B4" title="已与服务器同步"></i>';
}
function blobToDataURL(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)})}

/* ---------------- 1. 内置谱库（入门级） ---------------- */
/* note: {n:'1'-'7' | '-'延音 | '0'休止, o:-1/0/1 八度, d:时值(1=四分), t:技法} */
const N=(n,o=0,d=1,t='')=>({n,o,d,t});
const SCORE_LIB=[
 {id:'sc01',title:'五声音阶练习',cat:'基本功',key:'D 调',bpm:60,level:1,src:'自编练习曲',
  tip:'手腕放松，每个音落点清楚，先单手再双手。',
  lines:[
   {name:'① 上行',notes:[N('1'),N('2'),N('3'),N('5'),N('6'),N('5'),N('3'),N('2'),N('1',0,2)]},
   {name:'② 下行',notes:[N('6'),N('5'),N('3'),N('2'),N('1'),N('2'),N('3'),N('5'),N('1',0,2)]}
  ]},
 {id:'sc02',title:'轮音长音练习',cat:'基本功',key:'D 调',bpm:52,level:1,src:'自编练习曲',
  tip:'左竹起、右竹跟，密度均匀；数拍子，不忽快忽慢。',
  lines:[
   {name:'① 长轮',notes:[N('1',0,4,'轮'),N('5',0,4,'轮')]},
   {name:'② 换音轮',notes:[N('3',0,2,'轮'),N('5',0,2,'轮'),N('6',0,2,'轮'),N('5',0,2,'轮'),N('1',0,4,'轮')]}
  ]},
 {id:'sc03',title:'八度双音练习',cat:'基本功',key:'D 调',bpm:66,level:2,src:'自编练习曲',
  tip:'两竹同时落，听"一个音"而不是"两个音"。',
  lines:[
   {name:'① 同音八度',notes:[N('1',0,1,'八度'),N('2',0,1,'八度'),N('3',0,1,'八度'),N('5',0,1,'八度'),N('6',0,2,'八度')]},
   {name:'② 上行回落',notes:[N('6',0,1,'八度'),N('5',0,1,'八度'),N('3',0,1,'八度'),N('2',0,1,'八度'),N('1',0,2,'八度')]}
  ]},
 {id:'sc04',title:'琶音练习',cat:'基本功',key:'D 调',bpm:72,level:2,src:'自编练习曲',
  tip:'由低到高依次弹出，手腕带，不要用手臂甩。',
  lines:[
   {name:'① 上行琶音',notes:[N('1',0,1,'琶'),N('3',0,1),N('5',0,1),N('6',0,1),N('1',1,2)]},
   {name:'② 下行琶音',notes:[N('1',1,1,'琶'),N('6',0,1),N('5',0,1),N('3',0,1),N('1',0,2)]}
  ]},
 {id:'sc05',title:'小星星',cat:'入门曲目',key:'C 调',bpm:76,level:1,src:'儿歌',
  tip:'第一行全用单竹交替，第二行注意 5→4 的换弦位置。',
  lines:[
   {name:'①',notes:[N('1'),N('1'),N('5'),N('5'),N('6'),N('6'),N('5',0,2)]},
   {name:'②',notes:[N('4'),N('4'),N('3'),N('3'),N('2'),N('2'),N('1',0,2)]},
   {name:'③',notes:[N('5'),N('5'),N('4'),N('4'),N('3'),N('3'),N('2',0,2)]},
   {name:'④',notes:[N('5'),N('5'),N('4'),N('4'),N('3'),N('3'),N('2',0,2)]},
   {name:'⑤',notes:[N('1'),N('1'),N('5'),N('5'),N('6'),N('6'),N('5',0,2)]},
   {name:'⑥',notes:[N('4'),N('4'),N('3'),N('3'),N('2'),N('2'),N('1',0,2)]}
  ]},
 {id:'sc06',title:'两只老虎',cat:'入门曲目',key:'C 调',bpm:80,level:1,src:'儿歌',
  tip:'第三行是八分音符，容易抢拍，跟着节拍器慢来。',
  lines:[
   {name:'①',notes:[N('1'),N('2'),N('3'),N('1'),N('1'),N('2'),N('3'),N('1')]},
   {name:'②',notes:[N('3'),N('4'),N('5',0,2),N('3'),N('4'),N('5',0,2)]},
   {name:'③',notes:[N('5',0,.5),N('6',0,.5),N('5',0,.5),N('4',0,.5),N('3'),N('1')]},
   {name:'④',notes:[N('5',0,.5),N('6',0,.5),N('5',0,.5),N('4',0,.5),N('3'),N('1')]},
   {name:'⑤',notes:[N('2'),N('5',-1),N('1',0,2),N('2'),N('5',-1),N('1',0,2)]}
  ]},
 {id:'sc07',title:'欢乐颂',cat:'入门曲目',key:'C 调',bpm:72,level:2,src:'贝多芬',
  tip:'第 2、4 小节的附点要撑住，不要提前走。',

/* ---------------- 4. 五线谱渲染（自绘 SVG，零依赖） ---------------- */
const PITCH_IDX={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
const KEY_ACC={'C 调':[],'D 调':['F#5','C#5'],'G 调':['F#5'],'F 调':['A#4']};
function pitchStep(p){
  if(!p||p==='R')return null;
  const m=/^([A-G])(#|b)?(-?\d)$/.exec(p); if(!m)return 0;
  return (parseInt(m[3])-4)*7+PITCH_IDX[m[1]];
}
const STAFF_TOP=44, STAFF_GAP=10;               /* 第五线 y=44 … 第一线 y=84 */
function pitchY(p){const s=pitchStep(p);return 94-s*5}
function keyAccY(p){const s=pitchStep(p);return 94-s*5}

function renderScore(sc,opts){
  opts=opts||{};
  const lines=opts.lines, marks=opts.marks||[], clickable=!!opts.clickable;
  let h='<div class="score-box">';
  let gi=0;
  sc.lines.forEach((ln,li)=>{
    if(lines && lines.indexOf(li)<0)return;
    const ns=ln.notes, W=Math.max(320, 108+ns.length*44), H=132;
    h+='<div class="line-lbl">'+esc(ln.name)+'</div>';
    h+='<div class="staff-scroll"><svg class="staff-svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">';
    for(let k=0;k<5;k++) h+='<line x1="0" y1="'+(STAFF_TOP+k*STAFF_GAP)+'" x2="'+W+'" y2="'+(STAFF_TOP+k*STAFF_GAP)+'" stroke="#9aa4b2" stroke-width="1"/>';
    h+='<line x1="0" y1="'+STAFF_TOP+'" x2="0" y2="'+(STAFF_TOP+40)+'" stroke="#6b7280" stroke-width="2.4"/>';
    h+='<text x="6" y="82" font-size="42" font-family="Bravura,Apple Symbols,Segoe UI Symbol,serif" fill="#1f2328">\uD834\uDD1E</text>';
    (KEY_ACC[sc.key]||[]).forEach((a,i)=>{
      h+='<text x="'+(46+i*13)+'" y="'+(keyAccY(a)+4)+'" font-size="19" font-family="serif" fill="#1f2328">\u266F</text>';
    });
    h+='<text x="'+(46+(KEY_ACC[sc.key]||[]).length*14)+'" y="62" font-size="17" font-weight="700" font-family="serif" fill="#1f2328">4</text>';
    h+='<text x="'+(46+(KEY_ACC[sc.key]||[]).length*14)+'" y="82" font-size="17" font-weight="700" font-family="serif" fill="#1f2328">4</text>';
    let x=100, beats=0;
    ns.forEach((n,i)=>{
      const mk=marks.filter(m=>m.li===li&&m.i===i)[0];
      const cls='note-g'+(clickable?' clickable':'')+(mk?(' m-'+mk.type):'');
      h+='<g class="'+cls+'" data-li="'+li+'" data-i="'+i+'" '+(clickable?'onclick="A.noteClick(this)"':'')
        +' data-x="'+x+'">';
      if(mk){
        const t=MARK_TYPES.filter(t=>t.k===mk.type)[0]||{bg:'#eee',c:'#666'};
        h+='<rect x="'+(x-15)+'" y="'+(STAFF_TOP-22)+'" width="30" height="84" rx="7" fill="'+t.bg+'" stroke="'+t.c+'" stroke-width="1.4"/>';
      }
      h+='<rect x="'+(x-16)+'" y="'+(STAFF_TOP-4)+'" width="32" height="48" fill="transparent"/>';
      if(n.p==='R'){
        h+='<path d="M '+(x-4)+' '+(58)+' q 6 4 0 9 q 4 5 8 9 q -3 5 -7 6 q 5 3 1 9" fill="none" stroke="#374151" stroke-width="2"/>';
      }else{
        const y=pitchY(n.p);
        for(let ly=94; ly<=y; ly+=10) h+='<line x1="'+(x-11)+'" y1="'+ly+'" x2="'+(x+11)+'" y2="'+ly+'" stroke="#6b7280" stroke-width="1.2"/>';
        for(let ly=34; ly>=y; ly-=10) h+='<line x1="'+(x-11)+'" y1="'+ly+'" x2="'+(x+11)+'" y2="'+ly+'" stroke="#6b7280" stroke-width="1.2"/>';
        const full=(n.d>=2);
        h+='<ellipse cx="'+x+'" cy="'+y+'" rx="6.4" ry="4.6" fill="'+(full?'#fff':'#1f2328')+'" stroke="#1f2328" stroke-width="1.6"/>';
        if(full) h+='<ellipse cx="'+x+'" cy="'+y+'" rx="2.4" ry="1.7" fill="#1f2328" opacity="'+(n.d>=3.5?'.9':'0')+'"/>';
        if(n.d<2){
          const up=(y>=64), sx=up?x+5.8:x-5.8, ey=up?y-30:y+30;
          h+='<line x1="'+sx+'" y1="'+y+'" x2="'+sx+'" y2="'+ey+'" stroke="#1f2328" stroke-width="1.6"/>';
          if(n.d<=0.5) h+='<path d="M '+sx+' '+ey+' q 9 4 11 16" fill="none" stroke="#1f2328" stroke-width="2.2"/>';
        }
        if(n.t) h+='<text x="'+x+'" y="'+(y-26)+'" font-size="11" text-anchor="middle" fill="#7c3aed" font-weight="700">'+esc(n.t)+'</text>';
      }
      if(mk) h+='<circle cx="'+(x+13)+'" cy="'+(STAFF_TOP-14)+'" r="6.5" fill="'+(MARK_TYPES.filter(t=>t.k===mk.type)[0]||{c:'#666'}).c+'"/>'
        +'<text x="'+(x+13)+'" y="'+(STAFF_TOP-11)+'" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="700">'+esc(mk.type[0])+'</text>';
      h+='</g>';
      beats+=n.d||1;
      x+=38+(n.d>1?14:0);
      if(beats>=4){ beats=0; h+='<line x1="'+(x-14)+'" y1="'+STAFF_TOP+'" x2="'+(x-14)+'" y2="'+(STAFF_TOP+40)+'" stroke="#6b7280" stroke-width="1.4"/>'; }
    });
    h+='<line x1="'+(W-1)+'" y1="'+STAFF_TOP+'" x2="'+(W-1)+'" y2="'+(STAFF_TOP+40)+'" stroke="#6b7280" stroke-width="2.4"/>';
    h+='</svg></div>';
    gi++;
  });
  h+='</div>';
  if(marks.length){
    h+='<div class="legend">'+MARK_TYPES.map(t=>{
      const c=marks.filter(m=>m.type===t.k).length;
      return c?'<span style="background:'+t.bg+';color:'+t.c+'">'+t.k+' ×'+c+'</span>':'';
    }).join('')+'</div>';
  }
  return h;
}
function markList(marks){
  if(!marks||!marks.length)return '<div class="small muted">还没有标记。点谱面上的音符可以添加。</div>';

    +'<span class="small grow">第'+(m.li+1)+'行第'+(m.i+1)+'音'+(m.note?' · '+esc(m.note):'')+'</span></div>').join('');
}

A.markSave=function(li,i){
  const p=T.wiz.pieces[T.cur];

  const type=(picked&&picked.dataset.type)||_mkType||(p.marks.find(m=>m.li===li&&m.i===i)||{}).type||'重点';

A.saveLesson=async function(){
  const w=T.wiz;
  if(!w.studentId)return toast('先选学生');
  if(!w.pieces.length)return toast('至少要有一首曲子');
  const lsn={id:uid('lsn'),studentId:w.studentId,date:w.date,
    pieces:w.pieces.map(p=>({scoreId:p.scoreId,focus:p.criteria})),
    points:[{t:w.points.join('、')||'课堂要点',x:w.note}],note:w.note,createdAt:Date.now()};
  const hwList=w.pieces.map(p=>{
    const sc=byId(S.scores,p.scoreId);
    return {id:uid('hw'),studentId:w.studentId,lessonId:lsn.id,scoreId:p.scoreId,
      title:sc.title+' · '+(p.lines.length===sc.lines.length?'全曲':'第'+p.lines.map(x=>x+1).join('/')+'行'),
      lines:p.lines.slice(),target:{...p.target},criteria:p.criteria.slice(),
      marks:p.marks.map(m=>({...m})),due:dayAdd(w.date,6),status:'assigned',
      demoVideoId:p.demoVideoId||'',classAudioId:p.classAudioId||'',
      sub:null,review:null,createdAt:Date.now()};
  });
  const st=byId(S.students,w.studentId);
  T.wiz=null;T.tab='t-review';
  if(ONLINE){
    toast('正在发布…');
    try{
      await api('/api/lesson',{lesson:lsn,homework:hwList});
      await pull(true); render();
      toast('已发布 '+hwList.length+' 张任务卡 → '+st.name+'（学生端立即可见）');
    }catch(e){ S.lessons.push(lsn); hwList.forEach(h=>S.homework.push(h)); save(); render();
      toast('发布失败，已暂存本机'); }
  }else{
    S.lessons.push(lsn); hwList.forEach(h=>S.homework.push(h)); save(); render();
    toast('已保存课次，并生成 '+hwList.length+' 张任务卡 → '+st.name);
  }
};

async function uploadMedia(kind,blob){
  const data=await blobToDataURL(blob);
  return await api('/api/media',{kind:kind,data:data,type:blob.type||''});
}
let crec=null,cstream=null;
A.classRec=function(){
  const btn=document.getElementById('clsRecBtn');
  if(crec&&crec.state==='recording'){crec.stop();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('这个浏览器不支持录音');return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    cstream=st; crec=new MediaRecorder(st); const ch=[];
    crec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    crec.onstop=async()=>{
      st.getTracks().forEach(t=>t.stop());
      const blob=new Blob(ch,{type:crec.mimeType||'audio/webm'});
      crec=null;
      toast('正在上传录音…');
      const r=await uploadMedia('audio',blob);
      if(r.ok){T.wiz.pieces[T.cur].classAudioId=r.id;render();toast('课堂录音已保存，孩子端能听到')}
      else toast('上传失败');
    };
    crec.start(); btn.textContent='■ 停止并保存'; btn.className='btn sm pri';
    toast('录音中…最长 3 分钟');
    setTimeout(()=>{if(crec&&crec.state==='recording')crec.stop()},180000);
  }).catch(e=>toast('没打开麦克风：'+(e.message||'')));
};
A.pickVideo=function(){
  const i=document.createElement('input'); i.type='file'; i.accept='video/*';
  i.onchange=async()=>{
    const f=i.files[0]; if(!f)return;
    if(f.size>25*1024*1024)return toast('视频太大了（>25MB），请压缩或录短一点');
    toast('正在上传示范视频…');
    const r=await uploadMedia('video',f);
    if(r.ok){T.wiz.pieces[T.cur].demoVideoId=r.id;render();toast('示范视频已上传，孩子端能回看')}
    else toast('上传失败：'+(r.msg||''));
  };
  i.click();
};

let metro=null,timer=null,rec=null,recChunks=[],recStream=null,paused=false;
function beep(strong){
  try{
    const C=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());
    const o=C.createOscillator(),g=C.createGain();
    o.frequency.value=strong?1200:820;o.connect(g);g.connect(C.destination);
    g.gain.setValueAtTime(.0001,C.currentTime);
    g.gain.exponentialRampToValueAtTime(.35,C.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+.07);
    o.start();o.stop(C.currentTime+.09);
  }catch(e){}
}
function metroStop(){if(metro){clearInterval(metro);metro=null}const b=document.getElementById('mBtn');if(b){b.textContent='▶ 节拍器';b.className='btn sm'}}
function metroToggle(){
  const b=document.getElementById('mBtn');
  if(metro){metroStop();return}
  const bpm=+document.getElementById('pBpm').value||60;
  let k=0;
  metro=setInterval(()=>{beep(k%4===0);k++},Math.round(60000/bpm));
  b.textContent='■ 停止';b.className='btn sm pri';
}
function timerTick(){
  const px=ST.px;if(!px||paused)return;
  px.sec++;
  const m=Math.floor(px.sec/60),s=px.sec%60;
  const el=document.getElementById('pTime');if(el)el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function timerToggle(){
  const b=document.getElementById('tBtn');
  if(timer){clearInterval(timer);timer=null;paused=true;b.textContent='▶ 继续';b.className='btn sm pri';return}
  timer=setInterval(timerTick,1000);paused=false;b.textContent='⏸ 暂停';b.className='btn sm';
}
function stopPx(){metroStop();if(timer){clearInterval(timer);timer=null}
  if(rec&&rec.state==='recording')rec.stop();
  if(recStream)recStream.getTracks().forEach(t=>t.stop());
  rec=null;recStream=null;ST.px=null;}
window._stopPx=stopPx;

B.rec=async function(){
  const btn=document.getElementById('rBtn'),tip=document.getElementById('rTip'),box=document.getElementById('rBox');
  if(rec&&rec.state==='recording'){rec.stop();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    tip.innerHTML='<span style="color:var(--warn)">这个环境不能录音（需要 https 或本地服务）。用手机录好，直接提交即可。</span>';return;
  }
  try{
    recStream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(recStream);recChunks=[];
    rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
    rec.onstop=()=>{
      const blob=new Blob(recChunks,{type:rec.mimeType||'audio/webm'});
      recStream.getTracks().forEach(t=>t.stop());
      const aid=uid('au');ST.px.audioId=aid;ST.px.audioBlob=blob;
      DB.put(aid,blob);
      box.innerHTML='<audio controls src="'+URL.createObjectURL(blob)+'" style="width:100%;margin-top:8px"></audio>'
        +'<div class="row" style="margin-top:6px"><span class="tiny muted">已录制，可回放确认</span>'
        +'<button class="btn xs" onclick="B.delRec()">删除重录</button></div>';
      btn.textContent='🎙 重新录音';btn.className='btn sm';tip.textContent='已保存';
      rec=null;
    };
    rec.start();btn.textContent='■ 停止录音';btn.className='btn sm pri';tip.textContent='录音中…（最长 3 分钟）';
    setTimeout(()=>{if(rec&&rec.state==='recording')rec.stop()},180000);
  }catch(e){tip.innerHTML='<span style="color:var(--warn)">麦克风没打开：'+esc(e.message||'')+'</span>'}
};
B.delRec=function(){
  if(ST.px&&ST.px.audioId){DB.del(ST.px.audioId);ST.px.audioId=null;ST.px.audioBlob=null}
  const box=document.getElementById('rBox');if(box)box.innerHTML='';
  const btn=document.getElementById('rBtn');if(btn){btn.textContent='🎙 开始录音'}
  const tip=document.getElementById('rTip');if(tip)tip.textContent='录一段最完整的一遍即可';
};

    note:(document.getElementById('pNote')||{}).value||'',audioId:px.audioId||'',at:Date.now()};

function viewFeedback(){

     +'<span class="tag '+(hw.review.judge==='达标'?'ok':hw.review.judge==='需改进'?'warn':'info')+'">'+esc(hw.review.judge)+'</span></div>'
     +'<div class="tiny muted">'+new Date(hw.review.at).toLocaleDateString('zh-CN')+' · 你练了 '+hw.sub.minutes+' 分钟 / '+hw.sub.repeats+' 遍</div>'
     +(hw.review.comment?'<div class="card tight" style="margin-top:8px;background:var(--stu-soft);border-color:var(--stu-line)">🎵 老师说：'+esc(hw.review.comment)+'</div>':'')
     +(miss.length?'<div class="card tight" style="margin-top:8px;background:var(--warn-soft);border-color:#f5d9a8"><b class="small">还要改的地方</b>'

function dl(name,text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function b64(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
function unb64(s){const p=s.split(',');const bin=atob(p[1]);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:p[0].match(/:(.*?);/)[1]||'audio/webm'})}
async function collectAudio(ids){const o={};for(const id of ids){if(!id)continue;const b=await DB.get(id);if(b)o[id]=await b64(b)}return o}
async function restoreAudio(map){for(const k in map){try{await DB.put(k,unb64(map[k]))}catch(e){}}}

function doImport(text){
  let j;try{j=JSON.parse(text)}catch(e){return toast('文件解析失败')}
  if(j.type==='yangqin-mvp-full'){
    if(!confirm('导入备份会覆盖当前全部数据，继续？'))return;
    S=j.data;save();restoreAudio(j.audio||{});closeSheet();render();toast('备份已恢复');return;
  }
  if(j.type==='yangqin-mvp-student'){
    if(!j.student)return toast('文件缺少学生信息');
    let st=S.students.find(s=>s.name===j.student.name&&s.id===j.student.id)||S.students.find(s=>s.id===j.student.id);
    if(!st){st={...j.student};S.students.push(st)}
    let n=0,upd=0;
    (j.homework||[]).forEach(h=>{
      const ex=S.homework.find(x=>x.id===h.id);
      if(ex){
        if(h.sub&&(!ex.sub||h.sub.at>ex.sub.at)){
          ex.sub=h.sub;if(ex.status!=='reviewed')ex.status='submitted';upd++;
        }
        if(h.review){ex.review=h.review;ex.status='reviewed'}
      }
      else{S.homework.push(h);n++}
    });
    save();restoreAudio(j.audio||{});closeSheet();render();
    toast('导入成功：新增 '+n+' 条，更新 '+upd+' 条（'+st.name+'）');return;
  }
  toast('不认识的文件格式');
}

<script>
/* =========================================================
   PRD 扩展包 v0.2  ——  补齐 PRD 中尚未落地的能力
   M2 微目标 / M3 逐条批改与催交 / M5 85% 自适应 / M6 成长体系
   M7 批注继承与导出 / 历史查询 / CSV / A4 打印 / 自编谱录入
   ========================================================= */
var TECH_LIB = [
  {k:'轮音',     cat:'技法', std:'每拍 4 下均匀不断，听不出颗粒', reps:5, pass:3},
  {k:'支手轮音', cat:'技法', std:'支手稳定不掉，轮音持续 4 拍', reps:5, pass:3},
  {k:'双音轮音', cat:'技法', std:'两音同时落，力度一致', reps:5, pass:3},
  {k:'反竹',     cat:'技法', std:'反竹音色清脆，不碰邻弦', reps:4, pass:3},
  {k:'竹法顺序', cat:'技法', std:'左右竹交替正确，不错竹', reps:5, pass:4},
  {k:'双音琴竹', cat:'技法', std:'双音同时落，听成"一个音"', reps:5, pass:3},
  {k:'八度双音', cat:'技法', std:'八度两音整齐，无先后', reps:5, pass:3},
  {k:'琶音',     cat:'技法', std:'由低到高连贯，颗粒清晰', reps:4, pass:3},
  {k:'花音',     cat:'技法', std:'花音快速带过，不占主拍', reps:4, pass:3},
  {k:'滑弹',     cat:'技法', std:'滑动连贯，落点准确', reps:4, pass:3},
  {k:'拨弦',     cat:'技法', std:'拨弦音色干净，无杂音', reps:4, pass:3},
  {k:'压音',     cat:'技法', std:'压弦音准到位，回弹干净', reps:4, pass:3},
  {k:'泛音',     cat:'技法', std:'泛音清亮，无实音混杂', reps:4, pass:3},
  {k:'顿音',     cat:'技法', std:'顿住后立即放松，不过长', reps:4, pass:3},
  {k:'颤竹',     cat:'技法', std:'颤动均匀，手腕不僵', reps:4, pass:3},
  {k:'连竹',     cat:'技法', std:'连接处无断口，气息连贯', reps:5, pass:3},
  {k:'齐竹',     cat:'技法', std:'双手同时落竹，整齐', reps:5, pass:3},
  {k:'单竹',     cat:'技法', std:'单竹音色扎实，位置准确', reps:5, pass:4},
  {k:'上下滑音', cat:'技法', std:'滑音方向准确，终点音准', reps:4, pass:3},
  {k:'揉弦',     cat:'技法', std:'揉弦幅度均匀，不抢拍', reps:4, pass:3},
  {k:'跳音',     cat:'技法', std:'短促有弹性，手指不压', reps:4, pass:3},
  {k:'保持音',   cat:'技法', std:'时值唱满，不提前收音', reps:5, pass:4},
  {k:'全曲连贯', cat:'综合', std:'整首不断、不返工', reps:3, pass:2},
  {k:'慢练过句', cat:'综合', std:'按设定 BPM 完整过一遍不出错', reps:3, pass:2},
  {k:'背谱',     cat:'综合', std:'不看谱完整弹下来', reps:2, pass:1},
  {k:'分句呼吸', cat:'综合', std:'句读清楚，句尾有收束', reps:3, pass:2}
];
var MARK2TECH = {'轮音':'轮音','竹法':'竹法顺序','分句':'分句呼吸','慢练':'慢练过句','重点':'全曲连贯','难点':'慢练过句'};
var LOC_AUDIO = {};
var EXT = {selStu:null, planStu:null, histStu:'', histTech:'', histWeeks:8, sort:'miss', rvIdx:0, cmpWeek:null};

/* ---------- 微目标：数据工具 ---------- */
function xid(){ return 'g_' + Math.random().toString(36).slice(2, 9); }
function gDefault(pass){ return { reps:5, pass:pass || 3 }; }
function ensureGoals(hw){
  if (!hw) return [];
  if (!hw.goals || !hw.goals.length){
    var t = hw.target || { repeats:3, bpm:70 };
    var reps = t.repeats || 3;
    hw.goals = [{ id:xid(), tech:(hw.criteria && hw.criteria[0]) ? hw.criteria[0] : '全曲连贯',
      seg:'全曲', std:reps + ' 遍中成功 ' + Math.max(1, Math.ceil(reps * 0.6)) + ' 遍',
      reps:reps, pass:Math.max(1, Math.ceil(reps * 0.6)), bpm:t.bpm || 70, takes:[], note:'' }];
  }
  hw.goals.forEach(function(g){ if (!g.takes) g.takes = []; if (!g.id) g.id = xid(); });
  return hw.goals;
}
function gDone(g){ return (g.takes || []).filter(function(t){ return t.ok; }).length; }
function gPass(g){ return gDone(g) >= (g.pass || 1); }
function gRatio(hw){ var gs = ensureGoals(hw); if (!gs.length) return 0;
  return gs.filter(gPass).length / gs.length; }
function hwValid(hw){ return gRatio(hw) > 0; }
function hwSubDate(hw){ return hw.sub ? new Date(hw.sub.at || hw.createdAt) : null; }
function dayKey(ts){ var d = new Date(ts); return d.toISOString().slice(0, 10); }

/* 由批注草稿生成微目标（M7-08：批注 → 作业继承） */
function draftGoals(p, sc){
  var tg = p.target || { repeats:3, bpm:70 }, reps = tg.repeats || 3;
  var pass = Math.max(1, Math.ceil(reps * 0.6)), out = [];
  (p.marks || []).forEach(function(m){
    if (m.toGoal === false) return;
    var tk = MARK2TECH[m.type] || m.type;
    var lib = TECH_LIB.filter(function(x){ return x.k === tk; })[0];
    out.push({ id:xid(), tech:tk, seg:'第' + (m.li + 1) + '行第' + (m.i + 1) + '音',
      std:lib ? (reps + ' 遍中成功 ' + Math.min(reps, lib.pass) + ' 遍') : (reps + ' 遍中成功 ' + pass + ' 遍'),
      reps:reps, pass:lib ? Math.min(reps, lib.pass) : pass, bpm:tg.bpm || 70,
      takes:[], note:(m.note || '').slice(0, 30), mark:{ li:m.li, i:m.i, type:m.type } });
  });
  if (!out.length){
    out.push({ id:xid(), tech:'全曲连贯', seg:'全曲', std:reps + ' 遍中成功 ' + pass + ' 遍',
      reps:reps, pass:pass, bpm:tg.bpm || 70, takes:[], note:'' });
  }
  return out;

/* ---------- 85% 自适应引擎（M5） ---------- */
function weekKey(d){ var x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.toISOString().slice(0, 10); }
function stuHw(sid){ return S.homework.filter(function(h){ return h.studentId === sid; }); }
function weekStat(sid, wk){
  var list = stuHw(sid).filter(function(h){ return weekKey(h.createdAt) === wk; });
  var gs = []; list.forEach(function(h){ ensureGoals(h).forEach(function(g){ gs.push(g); }); });
  var done = gs.filter(gPass).length;
  return { week:wk, cards:list.length, goals:gs.length, done:done,
    rate:gs.length ? done / gs.length : null, submitted:list.filter(function(h){ return h.sub; }).length };
}
function recentStats(sid, n){
  var wks = {}; stuHw(sid).forEach(function(h){ wks[weekKey(h.createdAt)] = 1; });
  return Object.keys(wks).sort().reverse().slice(0, n).map(function(w){ return weekStat(sid, w); }).reverse();
}
function adaptFor(sid){
  var st = recentStats(sid, 2), tot = 0, n = 0;
  st.forEach(function(s){ if (s.rate !== null){ tot += s.rate; n++; } });
  var gpts = 0; stuHw(sid).forEach(function(h){ ensureGoals(h).forEach(function(g){ gpts += (g.takes || []).length; }); });
  var cur = new Date().toISOString().slice(0, 10);
  if (gpts < 6 || n === 0)
    return { level:'cold', tip:'数据不足，暂不提供建议', detail:'已记录 ' + gpts + ' 条练习数据（需 ≥ 6 条）', weeks:st, rate:null };
  var rate = tot / n, lv, act, why;
  if (rate >= 0.95){ lv = 'up'; act = '提速一档（BPM +5～10），或加一条新技法';
    why = '近 ' + n + ' 周达成率 ' + Math.round(rate * 100) + '% ≥ 95% → 过于轻松，应提速'; }
  else if (rate >= 0.80){ lv = 'keep'; act = '保持现有难度，遍数 +1 巩固';
    why = '近 ' + n + ' 周达成率 ' + Math.round(rate * 100) + '% 落在 80–95% → 处于最优挑战区（85% 规则）'; }
  else if (rate >= 0.55){ lv = 'down'; act = '降难度：BPM −10，或把片段拆成半行';
    why = '近 ' + n + ' 周达成率 ' + Math.round(rate * 100) + '% 落在 55–80% → 偏难，先降难度'; }
  else { lv = 'back'; act = '退回上一级：换成已掌握的片段重建信心';
    why = '近 ' + n + ' 周达成率 ' + Math.round(rate * 100) + '% < 55% → 明显超出当前水平'; }
  var stuck = st.length >= 2 && st.every(function(s){ return s.rate !== null && s.rate < 0.55; });
  return { level:lv, act:act, why:why, rate:rate, weeks:st, stuck:stuck,
    stuckTip:stuck ? '连续 2 周达成率 < 55%，该生可能卡住了：建议换片段或降低 BPM' : '' };
}
function mastery(sid){
  var m = {};
  stuHw(sid).forEach(function(h){ ensureGoals(h).forEach(function(g){
    if (!m[g.tech]) m[g.tech] = { tech:g.tech, goals:0, done:0, takes:0, ok:0 };
    m[g.tech].goals++; if (gPass(g)) m[g.tech].done++;
    m[g.tech].takes += (g.takes || []).length; m[g.tech].ok += gDone(g);
  }); });
  return Object.keys(m).map(function(k){ var o = m[k]; o.rate = o.goals ? o.done / o.goals : 0; return o; })
    .sort(function(a, b){ return b.goals - a.goals; });
}
function calcStreak(sid){
  var days = {};
  stuHw(sid).forEach(function(h){ if (h.sub && hwValid(h)) days[dayKey(h.sub.at || h.createdAt)] = 1; });
  var ks = Object.keys(days).sort().reverse(); if (!ks.length) return { n:0, frozen:0, days:ks };
  var st = byId(S.students, sid) || {}; var freeze = st.freeze == null ? 2 : st.freeze;
  var n = 0, used = 0, cur = new Date();
  for (var i = 0; i < 400; i++){
    var k = cur.toISOString().slice(0, 10);
    if (days[k]) { n++; }
    else if (used < freeze && n > 0) { used++; }
    else if (i > 0) { break; }
    else if (!days[k] && i === 0) { /* 今天还没练，不算断 */ }
    cur.setDate(cur.getDate() - 1);
  }
  return { n:n, frozen:freeze - used, days:ks };
}
function nudgeCount(hw){ return ((hw.nudges || []).filter(function(t){ return Date.now() - t < 7 * 86400e3; })).length; }

  if (A._rvRec && A._rvRec.state === 'recording'){ A._rvRec.stop(); return; }
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(st){
    var ch = []; A._rvRec = new MediaRecorder(st); A._rvRec.ondataavailable = function(e){ if (e.data.size) ch.push(e.data); };
    A._rvRec.onstop = async function(){

function missDays(st){
  var pend = stuHw(st.id).filter(function(h){ return h.status !== 'reviewed'; });
  if (!pend.length) return 0;
  var d = Math.floor((Date.now() - Math.min.apply(null, pend.map(function(h){ return h.createdAt; }))) / 86400e3);
  return d;
}
function stabTrend(sid){
  return recentStats(sid, 4).map(function(s){ return s.rate === null ? 0 : Math.round(s.rate * 100); });
}
function spark(v){
  if (!v.length) return '';
  var W = 90, H = 24, mx = 100, n = v.length;
  var pts = v.map(function(x, i){ return (i / Math.max(1, n - 1) * W).toFixed(1) + ',' + (H - x / mx * H).toFixed(1); }).join(' ');
  return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" style="vertical-align:middle">'
    + '<polyline points="' + pts + '" fill="none" stroke="#2563eb" stroke-width="2"/></svg>';
}
function viewCockpit(){

    var todo = stuHw(st.id).filter(function(h){ return h.status === 'submitted'; }).length;
    var m = missDays(st);
    return { st:st, rate:ss.rate, goals:ss.goals, done:ss.done, pend:pend, todo:todo, miss:m, trend:stabTrend(st.id) };
  });
  if (EXT.sort === 'miss') rows.sort(function(a, b){ return b.miss - a.miss; });

A.importScore = function(){

    + '<div class="sheet-actions"><button class="btn grow" onclick="closeSheet()">取消</button>'

A.impGo = function(){
  var raw = document.getElementById('impTxt').value.trim();
  if (!raw) return toast('先粘贴内容');
  var errs = [], lines = raw.split('\n').map(function(s){ return s.trim(); }).filter(Boolean).map(function(ln, li){
    var notes = [], toks = ln.split(/\s+/);
    toks.forEach(function(t){
      var m = t.match(/^([A-Ga-g])(\d)?(\/)?(-)?(\[([^\]]+)\])?$/);
      if (!m){ errs.push('第' + (li + 1) + '行：' + t); return; }
      notes.push({ p:m[1].toUpperCase() + (m[2] || '4'), d:m[3] ? 0.5 : 1, tie:!!m[4], t:m[6] || '' });
    });
    return { name:'第' + (li + 1) + '句', notes:notes };
  });
  if (errs.length && !lines.length) return toast('解析失败：' + errs[0]);
  var sc = { id:uid('sc'), title:document.getElementById('impT').value || '自编谱 ' + today(),
    key:document.getElementById('impK').value || 'C 大调', cat:'自编', bpm:parseInt(document.getElementById('impB').value, 10) || 76,
    tip:'老师自编', owner:'teacher', lines:lines };
  if (ONLINE) api('/api/score', { score:sc }).then(function(){ pull(true); }).catch(function(){});
  S.scores.push(sc); save(); closeSheet(); render();
  toast(errs.length ? '已生成，但有 ' + errs.length + ' 处没认出来' : '已生成《' + sc.title + '》');
};

        + '<button class="btn pri" onclick="B.addRep()">＋ 记一遍</button></div>'
        + '<div class="row" style="margin-top:8px;gap:8px">'
        + '<button class="btn sm pri" id="tBtn" onclick="timerToggle()">▶ 开始计时</button>'
        + '<div class="row" style="gap:4px"><input type="number" id="pBpm" value="' + hw.target.bpm + '" style="width:74px" onchange="metroStop()"><span class="tiny muted">BPM</span></div>'
        + '<button class="btn sm" id="mBtn" onclick="metroToggle()">▶ 节拍器</button></div></div>'
      + '<div class="card" style="margin-top:10px"><div class="spread"><h3>微目标 ' + (ST.px.gi + 1) + '/' + hw.goals.length + '</h3>'
        + '<div class="row" style="gap:4px;flex-wrap:wrap;margin-top:2px">' + hw.goals.map(function(x, i){
            return '<button class="chip ' + (i === ST.px.gi ? 'sel' : '') + '" onclick="B.goGoal(' + i + ')">' + (i + 1) + '</button>';
          }).join('') + '</div></div>'
        + goalLine(g) + '<div style="margin-top:6px">' + goalBar(g) + '</div>'
        + '<div class="row" style="margin-top:8px;gap:8px">'
        + '<button class="btn sm pri" id="rBtn" onclick="B.rec()">🎙 录这一遍</button>'
        + '<span class="tiny muted" id="rTip">录完自己判断：这一遍做到了吗？</span></div>'
        + '<div id="rBox"></div>'
        + '<div class="row" style="margin-top:8px;gap:8px">'
        + '<button class="btn grow" onclick="B.take(false)">↻ 再来一遍</button>'
        + '<button class="btn pri grow" onclick="B.take(true)">✓ 这遍做到了</button></div>'
        + '<div class="tiny muted" style="margin-top:6px">系统只记录"练了/练了多久/稳不稳"，不评价弹得好不好。</div></div>'
      + '<div class="card tight" style="margin-top:10px"><h3>谱面标记 · 这次做到了吗</h3>'
        + ((hw.marks && hw.marks.length) ? hw.marks.map(function(m, i){
            var ok = (hw.checks || [])[i];
            return '<div class="row" style="gap:8px;padding:6px 0;border-bottom:1px solid var(--line2)">'
              + '<span class="tag" style="background:' + (MARK_TYPES.filter(function(t){ return t.k === m.type; })[0] || { bg:'#eee' }).bg + '">' + esc(m.type) + '</span>'
              + '<span class="small grow">第' + (m.li + 1) + '行第' + (m.i + 1) + '音' + (m.note ? ' · ' + esc(m.note) : '') + '</span>'
              + '<button class="btn xs ' + (ok === true ? 'pri' : '') + '" onclick="B.check(' + i + ',true)">做到了</button>'
              + '<button class="btn xs ' + (ok === false ? 'danger' : '') + '" onclick="B.check(' + i + ',false)">还没</button></div>';
          }).join('') : '<div class="small muted">这张卡没有谱面标记</div>')
        + '<div class="tiny muted" style="margin-top:6px">没做到的会自动进下一张卡，老师会带着你重练。</div></div>'
      + '<div class="card tight" style="margin-top:10px"><h3>今天练得怎么样</h3>'
        + '<div class="row wrap" id="selfRow">' + SELF_LEVELS.map(function(s){
            return '<button class="chip" data-s="' + s.k + '" onclick="B.setSelf(\'' + s.k + '\')">' + s.k + '</button>'; }).join('') + '</div>'
        + '<textarea id="pNote" style="margin-top:8px" placeholder="想对老师说的话（哪里卡住了？）"></textarea>'
        + '<label class="row tiny muted" style="margin-top:6px;gap:6px"><input type="checkbox" id="pByParent" style="width:auto"> 由家长代提交</label></div>'
      + '<div class="row" style="margin-top:12px;gap:8px">'
        + '<button class="btn grow" onclick="B.cancelPx()">先不练了</button>'
        + '<button class="btn pri grow" onclick="B.submit()">提交回课 ✓</button></div>';
    openSheet(h, function(){ B.setSelf('还行'); });
  };
  B._draw = draw; draw();
};
B.goGoal = function(i){ ST.px.gi = i; if (window._stopPx) window._stopPx(); B._draw(); };
B.rec = async function(){
  var btn = document.getElementById('rBtn'), tip = document.getElementById('rTip'), box = document.getElementById('rBox');
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    tip.innerHTML = '<span style="color:var(--warn)">这个环境不能录音（需要 https 或本地服务）。不录音也能记遍数。</span>'; return;
  }
  try{
    recStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    rec = new MediaRecorder(recStream); recCh = [];
    rec.ondataavailable = function(e){ if (e.data.size) recCh.push(e.data); };
    rec.onstop = async function(){
      recStream.getTracks().forEach(function(t){ t.stop(); });
      var blob = new Blob(recCh, { type:'audio/webm' });
      ST.px.audioBlob = blob; ST.px.audioId = null;
      box.innerHTML = '<audio controls src="' + URL.createObjectURL(blob) + '" style="width:100%;margin-top:6px"></audio>';
      tip.textContent = '录好了，点「这遍做到了」或「再来一遍」';
      btn.textContent = '🎙 重录'; rec = null;
    };
    rec.start(); btn.textContent = '■ 停止'; tip.textContent = '录音中…';
    setTimeout(function(){ if (rec && rec.state === 'recording') rec.stop(); }, 300000);
  }catch(e){ tip.textContent = '没有麦克风权限，可以直接记遍数'; }
};
B.take = async function(ok){
  var hw = byId(S.homework, ST.px.id); if (!hw) return;
  var g = hw.goals[ST.px.gi]; if (!g) return;
  var aid = '';
  if (ok && ST.px.audioBlob){ var up = await upAudio(ST.px.audioBlob); aid = up.id; }
  else if (ST.px.audioBlob){ var up2 = await upAudio(ST.px.audioBlob); aid = up2.id; }
  g.takes.push({ at:Date.now(), ok:!!ok, sec:ST.px.sec, audioId:aid });
  ST.px.audioBlob = null; ST.px.audioId = null; ST.px.repeats++;
  await patchHw(hw.id, { goals:hw.goals });
  if (gPass(g)) toast('✓ ' + g.tech + ' ' + gDone(g) + '/' + g.reps + ' 遍，达标了');
  else toast('已记 1 遍（' + gDone(g) + '/' + g.reps + '）');
  B._draw();
};
B.check = async function(i, ok){
  var hw = byId(S.homework, ST.px.id); if (!hw) return;
  var c = (hw.checks || []).slice(); while (c.length < hw.marks.length) c.push(undefined);
  c[i] = ok; await patchHw(hw.id, { checks:c }); B._draw();
};
B.submit = async function(){
  var hw = byId(S.homework, ST.px.id); if (!hw) return;
  var noteEl = document.getElementById('pNote'), parEl = document.getElementById('pByParent');
  var okGoals = ensureGoals(hw).filter(gPass).length;
  var sub = { minutes:Math.round((ST.px.sec || 0) / 60), repeats:ST.px.repeats,
    self:ST.px.self || '还行', note:noteEl ? noteEl.value : '',
    audioId:ST.lastAudioId || '', goals:hw.goals, checks:hw.checks || [],
    okGoals:okGoals, byParent:parEl ? !!parEl.checked : false };
  if (ONLINE){
    var payload = { id:hw.id, sub:sub };
    if (ST.px.audioBlob){ try { payload.audio = { data:await blobToDataURL(ST.px.audioBlob), type:ST.px.audioBlob.type }; } catch (e) {} }
    try { await api('/api/submit', payload); } catch (e) {}
    await pull(true);
  }
  hw.sub = sub; hw.status = 'submitted'; save();
  if (window._stopPx) window._stopPx();
  closeSheet(); render();
  toast(okGoals ? '已提交！达标 ' + okGoals + ' 条，老师那边马上能看到' : '已提交，老师那边马上能看到');
};
B.copyPrev = function(hwId){
  var hw = byId(S.homework, hwId); if (!hw) return;
  var prev = stuHw(ST.id).filter(function(h){ return h.scoreId === hw.scoreId && h.id !== hw.id && h.sub; })
    .sort(function(a, b){ return b.createdAt - a.createdAt; })[0];
  if (!prev) return toast('还没有上一次的录音可以比');
  var ids = [];
  ensureGoals(prev).forEach(function(g){ (g.takes || []).forEach(function(t){ if (t.audioId) ids.push(t.audioId); }); });
  if (!ids.length) return toast('上一次没有留下录音');
  openSheet('<h3>和上一次比一比</h3><div class="tiny muted">只和自己比（不提供和别的同学的比较）。</div>'
    + ids.slice(0, 5).map(function(id, i){
        return '<div style="margin-top:8px"><div class="tiny muted">上次的第' + (i + 1) + '遍</div>'
          + '<audio controls src="' + audioUrl(id) + '" style="width:100%"></audio></div>';
      }).join('')
    + '<div class="sheet-actions"><button class="btn grow" onclick="closeSheet()">关掉</button></div>');
};

function viewGrow(){
  var me = byId(S.students, ST.id); if (!me) return '<div class="empty">请先在老师端添加学生</div>';
  var sk = calcStreak(ST.id), m = mastery(ST.id);
  var h = '<div class="card"><h2>' + esc(me.name) + ' 的成长</h2>'
    + '<div class="grid3" style="margin-top:10px">'
    + '<div class="card tight" style="margin:0;text-align:center"><div style="font-size:22px;font-weight:800">' + sk.n + '</div><div class="tiny muted">连续有效练习</div></div>'
    + '<div class="card tight" style="margin:0;text-align:center"><div style="font-size:22px;font-weight:800">' + sk.frozen + '</div><div class="tiny muted">冻结卡剩余</div></div>'
    + '<div class="card tight" style="margin:0;text-align:center"><div style="font-size:22px;font-weight:800">' + m.length + '</div><div class="tiny muted">练过技法</div></div>'
    + '</div>'
    + '<div class="tiny muted" style="margin-top:8px">连续记录绑定「完成一次有效练习」（有一条微目标达标），不是打开页面。断了不归零，会消耗一张冻结卡；每月 2 张。</div></div>';
  h += '<div class="card"><h3>我练过的技法</h3>'
    + (m.length ? m.map(function(x){
        return '<div style="margin-top:8px"><div class="spread tiny"><span>' + esc(x.tech) + '（' + x.done + '/' + x.goals + ' 条达标）</span><b>' + Math.round(x.rate * 100) + '%</b></div>'
          + '<div class="pbar"><i style="width:' + Math.round(x.rate * 100) + '%"></i></div></div>';
      }).join('') : '<div class="empty">还没有记录</div>')
    + '<div class="tiny muted" style="margin-top:8px">这里没有分数、没有排名，只有你自己和上次相比。</div></div>';
  var hist = stuHw(ST.id).filter(function(x){ return x.status === 'reviewed'; }).sort(function(a, b){ return b.createdAt - a.createdAt; });
  h += '<div class="card"><h3>老师的回课</h3>'
    + (hist.length ? hist.slice(0, 10).map(function(hw){
        var sc = byId(S.scores, hw.scoreId) || { title:'' };
        var items = (hw.review && hw.review.items) ? hw.review.items : {};
        return '<div class="card tight" style="margin:8px 0"><div class="spread"><b>' + esc(sc.title) + '</b>'
          + '<span class="tiny muted">' + new Date(hw.review.at).toLocaleDateString('zh-CN') + '</span></div>'
          + '<div style="margin-top:6px">' + ensureGoals(hw).map(function(g){
              var it = items[g.id];
              return '<div style="padding:4px 0;border-bottom:1px solid var(--line2)">'
                + '<div class="tiny">' + esc(g.tech) + ' · ' + esc(g.seg) + ' · ' + gDone(g) + '/' + g.reps + ' 遍</div>'
                + (it && it.txt ? '<div class="small" style="color:var(--brand)">老师说：“' + esc(it.txt) + '”</div>' : '')
                + (it && it.audioId ? '<audio controls src="' + audioUrl(it.audioId) + '" style="width:100%;height:30px"></audio>' : '')
                + '</div>';
            }).join('') + '</div>'
          + '<button class="btn xs" style="margin-top:6px" onclick="B.copyPrev(\'' + hw.id + '\')">🔁 和上一次比一比</button></div>';
      }).join('') : '<div class="empty">还没有老师回课</div>') + '</div>';
  return h;
}

/* =========================================================
   装配：导航 + 渲染钩子
   ========================================================= */
function extNav(){
  var nt = document.querySelector('#navT .subnav-in'), ns = document.querySelector('#navS .subnav-in');
  if (nt && !document.getElementById('navMoreBtn')){
    nt.insertAdjacentHTML('beforeend',
      '<button id="navMoreBtn" onclick="A.more()">更多</button>');
  }
  if (ns && !document.getElementById('navGrowBtn')){
    ns.insertAdjacentHTML('beforeend', '<button id="navGrowBtn" data-tab="s-grow" onclick="B.go(\'s-grow\')">我的成长</button>');
  }
}
/* "更多"收纳低频入口，主栏只留高频四项 */
A.more = function(){
  openSheet('<h3>更多</h3>'
    + '<button class="btn block" onclick="closeSheet();A.go(\'t-plan\')">教学计划</button>'
    + '<button class="btn block" style="margin-top:8px" onclick="closeSheet();A.go(\'t-cockpit\')">周报驾驶舱</button>'
    + '<button class="btn block" style="margin-top:8px" onclick="closeSheet();A.go(\'t-hist\')">历史 / 导出</button>'
    + '<div class="sheet-actions"><button class="btn pri block" onclick="closeSheet()">关闭</button></div>');
};
var _renderT = renderT, _viewS = viewS, _render = render;
window.renderT = function(){
  if (T.tab === 't-cockpit') return viewCockpit();
  if (T.tab === 't-plan') return viewPlan();
  if (T.tab === 't-hist') return viewHist();
  return _renderT.apply(this, arguments);
};
window.viewS = function(){
  if (ST.tab === 's-grow') return viewGrow();
  return _viewS.apply(this, arguments);
};
window.render = function(){ extNav(); return _render.apply(this, arguments); };

/* 卡片上补：微目标进度 + 批注核对结果 */
var _cardHwTeacher = cardHwTeacher, _cardHwStudent = cardHwStudent;
window.cardHwTeacher = function(hw){
  var gs = ensureGoals(hw), done = gs.filter(gPass).length;
  var extra = '<div class="card tight" style="margin-top:-6px;background:var(--bg2)">'
    + '<div class="spread"><div class="tiny muted">微目标 ' + done + '/' + gs.length + ' 达标</div>'
    + '<div class="row" style="gap:6px">'
    + '<button class="btn xs" onclick="A.editGoals(\'' + hw.id + '\')">改目标</button>'
    + '<button class="btn xs" onclick="A.reviewGoals(\'' + hw.id + '\')">逐条批改</button>'
    + '<button class="btn xs" onclick="A.extendDue(\'' + hw.id + '\',3)">+3天</button>'
    + '<button class="btn xs" onclick="A.nudge(\'' + hw.id + '\')">催交(' + nudgeCount(hw) + '/2)</button>'
    + '</div></div>'
    + '<div style="margin-top:6px">' + gs.map(goalLine).join('') + '</div>'
    + ((hw.checks || []).length ? '<div class="tiny muted" style="margin-top:6px">批注核对：'
        + hw.checks.map(function(ok, i){ return (hw.marks[i] ? hw.marks[i].type : '') + (ok ? '✓' : '✗'); }).join('、') + '</div>' : '')
    + '</div>';
  return _cardHwTeacher(hw) + extra;
};
window.cardHwStudent = function(hw){
  if (hw.status === 'reviewed') return _cardHwStudent(hw);
  var gs = ensureGoals(hw);
  var extra = '<div class="card tight" style="margin-top:-6px;background:var(--bg2)">'
    + '<div style="margin-top:2px">' + gs.map(function(g){
        return '<div style="margin-bottom:6px">' + goalLine(g) + goalBar(g) + '</div>'; }).join('') + '</div></div>';
  return _cardHwStudent(hw) + extra;
};
